# Lint, type-check, test, and build. Those jobs install with `npm ci`, which installs exactly
# what package-lock.json pins and fails outright when the lock disagrees with package.json,
# rather than quietly resolving something other than what was committed. The Node 20 job does
# not install: it only loads the packed build on the engines floor.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Majors only. check-latest resolves each one to the newest patched release, so a
        # security release is used even when the runner image still has the previous build cached.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # publint catches a broken `exports` map or a file the package forgot to ship, and
      # are-the-types-wrong catches declarations that resolve for ESM but not CommonJS. Both are
      # otherwise only discovered by whoever installs the published package. node10 resolution
      # is ignored: it cannot read `exports` subpaths at all, and this package requires Node 20.
      - name: Verify the package
        run: npm run verify:package

      - name: Load the build as ESM and CommonJS
        run: npm run verify:dist

      # Packed exactly the way publish.yml packs it, so the release path is covered here rather
      # than discovered during a release. These two invocations drifting apart is what let a
      # broken pack step reach a tag once already.
      - name: Pack
        run: |
          mkdir -p dist-package
          npm pack --pack-destination dist-package

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist-package/*.tgz
          retention-days: 7

  # Node 20 is the engines floor. The test runner does not support it, so this job does not
  # install or test: it loads the tarball the build job packed, on the newest Node 20.
  load-node-20:
    name: Load the build on Node 20
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          check-latest: true

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist-package

      # npm pack wraps the published files in a `package/` directory. Strip that one level so
      # `dist/` lands where verify:dist imports it. scripts/ stays from the checkout; the
      # tarball does not ship it.
      - name: Unpack the build
        run: tar -xzf dist-package/*.tgz --strip-components=1

      - name: Load the build as ESM and CommonJS
        run: npm run verify:dist
