# Publishes to npm when a GitHub Release is published, matching how dregs-mcp releases.
#
# Authentication is npm Trusted Publishing: npm is configured to trust this repository and this
# workflow file over OIDC, so there is no token in repository secrets and the published package
# carries a provenance attestation. Configure the publisher at
# https://www.npmjs.com/package/@dregs/sdk/access under "Trusted publisher" with:
#
#   owner: dregs-sdk    repository: dregs-sdk-typescript    workflow: publish.yml    environment: npm
#
# Trusted publishing is configured per package on npmjs.com, which needs the package to already
# exist, so the first release of a new name cannot use it. Until then the publish step falls back
# to a granular npm access token held as the secret NPM_TOKEN in the `npm` environment. It must be
# a secret rather than a repository variable: variables are not masked and would print in logs.
# `id-token: write` and `--provenance` stay either way, so the attestation is produced regardless.
#
# Once @dregs/sdk exists on npm, configure the trusted publisher at the URL above, then delete the
# NODE_AUTH_TOKEN line below and revoke the token. A token that no longer exists cannot leak.
#
# The `npm` environment is the approval gate: a release cannot reach the registry without
# whoever is named as its reviewer signing off.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A tag that disagrees with the packaged version would publish something other than what
      # the release notes describe, and a version cannot be reused on npm once it is taken.
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$version tag=$tag"
          test "$version" = "$tag"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the package
        run: npm run verify:package

      - name: Load the build as ESM and CommonJS
        run: npm run verify:dist

      # npm does not create --pack-destination, it only writes into it, so the directory has to
      # exist first or the pack fails with ENOENT on the tarball it was about to write.
      - name: Pack
        run: |
          mkdir -p dist-package
          npm pack --pack-destination dist-package

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist-package/*.tgz

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@dregs/sdk
    permissions:
      id-token: write # required for Trusted Publishing and provenance; nothing else needs a token
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of what some runner images
      # ship with Node 22.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist-package

      # The tarball is passed with an explicit ./ prefix. npm reads a bare `dir/file` argument as
      # a GitHub shorthand (owner/repo) and tries to fetch it over git, which fails with
      # EALLOWGIT rather than anything that points at the real problem.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball=$(ls dist-package/*.tgz)
          test -f "$tarball"
          npm publish "./$tarball" --provenance --access public
